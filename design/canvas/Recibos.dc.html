<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #46617E; } a:hover { color: #33485F; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1000px; background: #FBFAF8; display: flex; flex-direction: column; box-sizing: border-box; padding: 64px 20px 32px; gap: 20px;">

  <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; color: #2A2926;">Recibos</h1>

  <div style="display: flex; gap: 8px;">
    <div style="flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; border: 1px solid #46617E; background: #ECF1F5; font-size: 14px; font-weight: 600; color: #46617E;">Mis recibos</div>
    <div style="flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; border: 1px solid #E4E0DA; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #6C6960;">Compartidos</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; gap: 20px; border-bottom: 1px solid #E4E0DA; overflow-x: auto;">
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #46617E; border-bottom: 2px solid #46617E; white-space: nowrap;">Todas</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Matrícula</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Médico</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Deporte</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Ropa</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Otro</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Sin categoría</span>
    </div>
    <div style="display: flex; gap: 20px; border-bottom: 1px solid #E4E0DA; overflow-x: auto;">
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">Todos los meses</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #46617E; border-bottom: 2px solid #46617E; white-space: nowrap;">2026-09</span>
      <span style="padding: 4px 0 8px; font-size: 13px; font-weight: 600; color: #6C6960; white-space: nowrap;">2026-08</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; color: #2A2926;">$182.000</div>
        <div style="font-size: 13px; color: #6C6960;">10 sep · Matrícula, Deporte · Sofía</div>
      </div>
      <span style="flex-shrink: 0; font-size: 12px; font-weight: 600; color: #767268;">Privado</span>
    </div>
    <div style="height: 1px; background: #EFECE6;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; color: #2A2926;">$24.500</div>
        <div style="font-size: 13px; color: #6C6960;">8 sep · Médico · Mateo</div>
      </div>
      <span style="flex-shrink: 0; font-size: 12px; font-weight: 600; color: #3F6B52;">Compartido</span>
    </div>
    <div style="height: 1px; background: #EFECE6;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
        <div style="font-size: 16px; font-weight: 600; color: #2A2926;">$9.990</div>
        <div style="font-size: 13px; color: #6C6960;">3 sep · Sin categoría</div>
      </div>
      <span style="flex-shrink: 0; font-size: 12px; font-weight: 600; color: #767268;">Privado</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <button style="height: 48px; border: none; border-radius: 12px; background: #46617E; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3.3v9.4M3.3 8h9.4" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/></svg>
    Agregar recibo
  </button>

</div>
</x-dc>
</body>
</html>
