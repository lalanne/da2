<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #46617E; } a:hover { color: #33485F; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1140px; background: #FBFAF8; display: flex; flex-direction: column; box-sizing: border-box; padding: 64px 24px 40px; gap: 24px;">

  <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; color: #2A2926;">Agregar recibo</h1>

  <div style="height: 132px; border: 1px solid #E4E0DA; border-radius: 16px; background: #F1EFEC; display: flex; align-items: center; justify-content: center; gap: 10px; color: #6C6960; font-size: 14px; font-weight: 600;">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="2.5" width="13" height="13" rx="2.5" stroke="#6C6960" stroke-width="1.4"/><path d="M5 12l3-3.5L11 12l2-2.5 1.5 2" stroke="#6C6960" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="6.5" r="1.2" fill="#6C6960"/></svg>
    recibo-matricula.jpg
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label style="font-size: 14px; font-weight: 600; color: #2A2926;">Monto</label>
    <div style="height: 50px; border: 1px solid #E4E0DA; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; font-size: 16px; color: #2A2926;">$182.000</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label style="font-size: 14px; font-weight: 600; color: #2A2926;">Fecha del gasto</label>
    <div style="height: 50px; border: 1px solid #E4E0DA; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; font-size: 16px; color: #2A2926;">2026-09-10</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <label style="font-size: 14px; font-weight: 600; color: #2A2926;">Etiquetas <span style="color: #767268; font-weight: 400;">(opcional)</span></label>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <span style="padding: 8px 14px; border-radius: 999px; background: #ECF1F5; border: 1px solid #46617E; color: #46617E; font-size: 13px; font-weight: 600;">Matrícula</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0DA; color: #6C6960; font-size: 13px; font-weight: 600;">Médico</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #ECF1F5; border: 1px solid #46617E; color: #46617E; font-size: 13px; font-weight: 600;">Deporte</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0DA; color: #6C6960; font-size: 13px; font-weight: 600;">Ropa</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0DA; color: #6C6960; font-size: 13px; font-weight: 600;">Otro</span>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #767268;">Puedes elegir varias, o ninguna. Sin etiquetas queda como "Sin categoría".</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label style="font-size: 14px; font-weight: 600; color: #2A2926;">Nota <span style="color: #767268; font-weight: 400;">(opcional)</span></label>
    <div style="min-height: 50px; border: 1px solid #E4E0DA; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; padding: 12px 14px; font-size: 16px; color: #767268;">Cuota de marzo</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label style="font-size: 14px; font-weight: 600; color: #2A2926;">Hijo/a <span style="color: #767268; font-weight: 400;">(opcional)</span></label>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <span style="padding: 8px 14px; border-radius: 999px; background: #ECF1F5; border: 1px solid #46617E; color: #46617E; font-size: 13px; font-weight: 600;">Sofía</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0DA; color: #6C6960; font-size: 13px; font-weight: 600;">Mateo</span>
      <span style="padding: 8px 14px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4E0DA; color: #6C6960; font-size: 13px; font-weight: 600;">Lucía</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 52px; border: none; border-radius: 12px; background: #46617E; color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;">Agregar recibo</button>
    <button style="height: 52px; border: none; background: none; font-size: 16px; font-weight: 600; font-family: inherit; color: #6C6960; cursor: pointer;">Cancelar</button>
  </div>

</div>
</x-dc>
</body>
</html>
