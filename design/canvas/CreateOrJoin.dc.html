<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #46617E; } a:hover { color: #33485F; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #FBFAF8; display: flex; flex-direction: column; box-sizing: border-box; padding: 72px 24px 40px;">

  <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px;">
    <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; color: #2A2926;">Configura tu hogar</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #6C6960; text-wrap: pretty;">Crea un hogar y agrega a tus hijos e hijas, o únete al hogar que ya creó la otra persona con un código de invitación.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">

    <button style="border: none; text-align: left; background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 12px; padding: 18px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-family: inherit;">
      <span style="width: 40px; height: 40px; border-radius: 10px; background: #ECF1F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 8.5 10 3l7 5.5V17a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1V8.5Z" stroke="#46617E" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 600; color: #2A2926;">Crear un hogar</span>
        <span style="font-size: 13px; line-height: 18px; color: #6C6960;">Serás la primera persona en el hogar</span>
      </span>
    </button>

    <button style="border: none; text-align: left; background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 12px; padding: 18px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; font-family: inherit;">
      <span style="width: 40px; height: 40px; border-radius: 10px; background: #ECF1F5; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10h9m0 0-3.5-3.5M13 10l-3.5 3.5" stroke="#46617E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 4h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-2" stroke="#46617E" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 16px; font-weight: 600; color: #2A2926;">Unirme con un código</span>
        <span style="font-size: 13px; line-height: 18px; color: #6C6960;">Ya recibiste un código de 8 caracteres</span>
      </span>
    </button>

  </div>

  <div style="flex-grow: 1;"></div>

  <p style="margin: 0; font-size: 13px; line-height: 18px; color: #767268; text-align: center;">Cada persona tiene un solo hogar.</p>

</div>
</x-dc>
</body>
</html>
