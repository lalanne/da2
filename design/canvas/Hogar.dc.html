<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; }
    a { color: #46617E; } a:hover { color: #33485F; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1040px; background: #FBFAF8; display: flex; flex-direction: column; box-sizing: border-box; padding: 64px 20px 32px; gap: 24px;">

  <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; color: #2A2926;">Hola, Javiera</h1>

  <div style="background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 14px; font-weight: 600; color: #6C6960; letter-spacing: 0.3px;">CÓDIGO DE INVITACIÓN</div>
    <div style="background: #F1EFEC; border-radius: 12px; padding: 18px 12px; text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #2A2926; font-family: ui-monospace, 'SF Mono', Menlo, monospace;">2Q8D48W4</div>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #6C6960;">Compártelo con tu co-madre o co-padre. Sirve una sola vez. Mantén presionado el código para copiarlo.</p>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button style="height: 48px; border: none; border-radius: 12px; background: #46617E; color: #FFFFFF; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.5 5.5a2 2 0 1 0-1.9-2.6L6.4 4.6M4.5 10.5a2 2 0 1 0 1.9 2.6l3.2-1.7M11.5 10.5a2 2 0 1 0 0 0Zm0 0-5-2.6M4.5 5.5l2 1" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/></svg>
        Compartir código
      </button>
      <button style="height: 44px; border: 1px solid #E4E0DA; border-radius: 12px; background: #FFFFFF; color: #46617E; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;">Generar un código nuevo</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; color: #9C978E; font-size: 13px; font-style: italic;">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="#9C978E" stroke-width="1.3"/><path d="M7 4.3V7l1.8 1.1" stroke="#9C978E" stroke-width="1.3" stroke-linecap="round"/></svg>
      Esperando a que se una tu co-madre o co-padre.
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 16px; font-weight: 600; color: #2A2926;">Integrantes del hogar</div>
    <div style="background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 12px; overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
        <span style="width: 34px; height: 34px; border-radius: 999px; background: #ECF1F5; color: #46617E; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center;">J</span>
        <span style="font-size: 15px; color: #2A2926;">Tú</span>
      </div>
      <div style="height: 1px; background: #EFECE6;"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px;">
        <span style="width: 34px; height: 34px; border-radius: 999px; background: #F1EFEC; border: 1px dashed #C9C3B8;"></span>
        <span style="font-size: 15px; color: #9C978E;">Lugar libre</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 16px; font-weight: 600; color: #2A2926;">Hijos e hijas</div>
    <div style="background: #FFFFFF; border: 1px solid #E4E0DA; border-radius: 12px; overflow: hidden;">
      <div style="padding: 14px 16px; font-size: 15px; color: #2A2926;">Sofía</div>
      <div style="height: 1px; background: #EFECE6;"></div>
      <div style="padding: 14px 16px; font-size: 15px; color: #2A2926;">Mateo</div>
      <div style="height: 1px; background: #EFECE6;"></div>
      <div style="padding: 14px 16px; font-size: 15px; color: #2A2926;">Lucía</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <button style="height: 48px; align-self: center; border: none; background: none; font-size: 15px; font-weight: 600; font-family: inherit; color: #6C6960; cursor: pointer;">Cerrar sesión</button>

</div>
</x-dc>
</body>
</html>
